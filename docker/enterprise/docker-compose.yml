services:
  # NOTE: image pulled from docker.iscinternal.com (InterSystems-internal registry,
  # requires VPN access) — the prior containers.intersystems.com tag
  # (2026.2.0AI.161.0) was removed from that registry and no longer resolves.
  # External contributors without ISC VPN access will need to substitute an
  # available irishealth AI-build tag from a registry they can reach, or use
  # scripts/test-container.sh (Community Edition, no VPN required) instead.
  iris-enterprise:
    image: docker.iscinternal.com/docker-intersystems/intersystems/irishealth:2026.3.0AI.113.0-linux-arm64v8
    container_name: ivg-iris-enterprise
    ports:
      - "31972:1972"
      - "62773:52773"
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/merge.cpf
    volumes:
      - ./iris.key:/usr/irissys/mgr/iris.key:ro
      - ./merge.cpf:/home/irisowner/merge.cpf:ro
      - ./libarno_callout.so:/tmp/libarno_callout.so:ro
      - ivg_enterprise_data:/home/irisowner/irisdata
    healthcheck:
      test: ["CMD", "/usr/irissys/bin/iris", "session", "iris", "-U%SYS", "Write 1"]
      interval: 15s
      timeout: 10s
      retries: 24
      start_period: 60s
    stdin_open: true
    tty: true

volumes:
  ivg_enterprise_data: {}
