# Packages this repo provides, and the versions they carry.
#
# PATCH mode, twice, over ONE tree. This is a third-party FORK, so upstream's hand-written
# `module.xml` is authoritative for its CONTENT — but not for its IDENTITY. The coordinator
# stamps the version, forces `<Name>` to the package id below, and remaps a
# `<ModuleReference>` to a sibling renamed in the same declaration. That last part matters
# here: upstream's manifest name is `iris-vector-graph`, while the estate's id is
# `trifour-iris-vector-graph` (what all seven site manifests and ODS's catalogue ask for),
# and this file's full package declares a `<Dependencies>` reference to the core package.
# Without the remap, renaming the pair would leave the engine depending on a module id that
# no longer exists.
#
# The fork keeps TWO upstream manifests at its root:
#
#   module.xml       -> trifour-iris-vector-graph        (full engine; depends on core)
#   module-core.xml  -> trifour-iris-vector-graph-core   (pure ObjectScript primitives)
#
# `manifest:` selects which one a package ships. Without a filter both would pack the WHOLE
# repo root, so the two archives would be identical content under two identities. `include`
# is the file filter that makes them disjoint, and it is exactly the resource list each
# manifest already declares:
#
#   module.xml      <SourcesRoot>iris_src/src</SourcesRoot> + 7 <Resource> entries:
#                   Graph.KG.{Edge,Loader,PyOps,Service,ArnoAccel,BenchFormat,Benchmark}
#                   It declares a dependency on iris-vector-graph-core, so the core classes
#                   come from the other package and must NOT be duplicated here.
#   module-core.xml <SourcesRoot>iris_src/src</SourcesRoot> + 19 <Resource> entries:
#                   Graph.KG.{VecIndex,PLAIDSearch,GraphIndex,Traversal,PageRank,Algorithms,
#                             Subgraph,BenchSeeder,Meta}
#                   plus the siblings Traversal delegates to since upstream spec 187 split it
#                   (2.20.7 — 2.20.6 shipped without them, so BuildKG hit
#                   <CLASS DOES NOT EXIST>): Graph.KG.{TraversalBuild,TraversalBFS,
#                   TraversalKHop,TraversalPaths,NKGAccel,NKGAccelAdjacency,
#                   NKGAccelCentrality,NKGAccelLoader,NKGAccelTraversal}
#                   Fork delta (2.20.8): TraversalBuild and Subgraph read the Graph_KG
#                   tables through dynamic SQL instead of embedded SQL. Those tables are
#                   created and migrated at runtime by the Python schema, so embedded SQL
#                   made core uncompilable on a fresh namespace and over a pre-spec-214
#                   rdf_edges (2.20.7: "Field 'GRAPH_ID' not found").
#                   Graph.KG.BM25Index (2.20.9): no shipped class references it, but the
#                   Python SDK and ODS GraphImport call it (iris.cls), so 2.20.8 imports
#                   failed "BM25 index build failed: iris.cls: error finding class".
#
# An IPM `<Resource Name="Graph.KG.Edge.CLS"/>` under `<SourcesRoot>iris_src/src</SourcesRoot>`
# resolves to the nested file `iris_src/src/Graph/KG/Edge.cls` (the same mapping ODS's
# `tools/deploy/support/ivg_ipm_lib.py` uses). The include paths below are those exact files,
# repo-relative. Only these travel: the other `.cls` files in the tree are optional SDK
# features no shipped class or estate caller needs, and stay out of both packages.
# tests/unit/test_ipm_package_closure.py fails when a shipped class or the shipped Python
# needs an unshipped class, and when these include lists drift from the manifests.

schema: trifour-ipm-packages-v1

repo: cagerber/iris-vector-graph

mode: patch

packages:
  - id: trifour-iris-vector-graph
    manifest: module.xml
    description: "Knowledge graph engine for InterSystems IRIS (full package; depends on iris-vector-graph-core)"
    include:
      - iris_src/src/Graph/KG/Edge.cls
      - iris_src/src/Graph/KG/Loader.cls
      - iris_src/src/Graph/KG/PyOps.cls
      - iris_src/src/Graph/KG/Service.cls
      - iris_src/src/Graph/KG/ArnoAccel.cls
      - iris_src/src/Graph/KG/BenchFormat.cls
      - iris_src/src/Graph/KG/Benchmark.cls

  - id: trifour-iris-vector-graph-core
    manifest: module-core.xml
    description: "Pure ObjectScript graph + vector primitives for IRIS (no Python required)"
    include:
      - iris_src/src/Graph/KG/VecIndex.cls
      - iris_src/src/Graph/KG/PLAIDSearch.cls
      - iris_src/src/Graph/KG/GraphIndex.cls
      - iris_src/src/Graph/KG/Traversal.cls
      - iris_src/src/Graph/KG/PageRank.cls
      - iris_src/src/Graph/KG/Algorithms.cls
      - iris_src/src/Graph/KG/Subgraph.cls
      - iris_src/src/Graph/KG/BenchSeeder.cls
      - iris_src/src/Graph/KG/Meta.cls
      - iris_src/src/Graph/KG/TraversalBuild.cls
      - iris_src/src/Graph/KG/TraversalBFS.cls
      - iris_src/src/Graph/KG/TraversalKHop.cls
      - iris_src/src/Graph/KG/TraversalPaths.cls
      - iris_src/src/Graph/KG/NKGAccel.cls
      - iris_src/src/Graph/KG/NKGAccelAdjacency.cls
      - iris_src/src/Graph/KG/NKGAccelCentrality.cls
      - iris_src/src/Graph/KG/NKGAccelLoader.cls
      - iris_src/src/Graph/KG/NKGAccelTraversal.cls
      - iris_src/src/Graph/KG/BM25Index.cls
